<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理系 LaTeX 语法参考面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.MathJax = {
            tex: {
                // 定义数学公式的边界符
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                // 加载 amsmath 与 braket 等高级物理宏包能力
                packages: {'[+]': ['base', 'ams', 'braket']}
            },
            startup: {
                // 禁用初始化自动渲染，交由 JavaScript 精确控制
                typeset: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        /* 针对包含多层分式或矩阵的物理公式优化显示字号 */
       .latex-render { font-size: 1.15rem; }
        /* 自定义滚动条以提升代码阅读体验 */
       .custom-scrollbar::-webkit-scrollbar { height: 6px; }
       .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

    <nav class="bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 id="app-title" class="text-2xl font-bold cursor-pointer select-none tracking-widest transition hover:text-indigo-200">
                物理系 LaTeX 参考指南
            </h1>
            <div id="admin-controls" class="hidden flex items-center space-x-4">
                <span class="bg-emerald-500 text-white px-3 py-1 rounded-full text-xs font-bold tracking-wider animate-pulse">ADMIN_MODE_ONLINE</span>
                <button onclick="openEditModal()" class="bg-white text-indigo-900 px-4 py-2 rounded-md shadow-sm hover:bg-indigo-50 font-semibold transition">
                    + 录入新物理公式
                </button>
                <button onclick="logoutAdmin()" class="bg-rose-500 text-white px-4 py-2 rounded-md shadow-sm hover:bg-rose-600 font-semibold transition">
                    销毁凭证退出
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-10">
        <div id="notification-area" class="fixed top-20 right-6 z-50 flex flex-col space-y-3"></div>
        
        <div class="mb-14">
            <h2 class="text-2xl font-bold text-indigo-900 mb-6 border-b-4 border-indigo-100 pb-2 inline-block">核心公式与物理算符体系 (Formula & Operators)</h2>
            <div id="formula-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                </div>
        </div>

        <div>
            <h2 class="text-2xl font-bold text-indigo-900 mb-6 border-b-4 border-indigo-100 pb-2 inline-block">LaTeX 文档结构与环境排版 (Document Structure)</h2>
            <div id="latex-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                </div>
        </div>
    </main>

    <div id="token-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-75 flex justify-center items-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-[28rem] transform scale-100">
            <h3 class="text-2xl font-bold text-slate-800 mb-2">安全鉴权终端</h3>
            <p class="text-sm text-slate-500 mb-6 leading-relaxed">系统检测到超级管理员唤醒指令。为开启写入权限，请输入包含严格绑定此仓库且具备 <strong>contents:write</strong> 权限的 Fine-grained Personal Access Token。</p>
            <input type="password" id="github-token-input" class="w-full border-2 border-slate-200 p-3 rounded-lg mb-6 font-mono text-sm focus:outline-none focus:border-indigo-500 transition" placeholder="github_pat_...">
            <div class="flex justify-end space-x-3">
                <button onclick="closeTokenModal()" class="px-5 py-2.5 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-medium transition">取消挂载</button>
                <button onclick="saveToken()" class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium shadow-md transition">注入凭证验证</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-75 flex justify-center items-center z-50 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto custom-scrollbar">
            <h3 id="edit-modal-title" class="text-2xl font-bold text-slate-800 mb-6 border-b pb-3">数据库条目映射编辑</h3>
            <input type="hidden" id="edit-id">
            
            <div class="grid grid-cols-2 gap-6 mb-5">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">架构根节点 (Root Category)</label>
                    <select id="edit-main-cat" class="w-full border-2 border-slate-200 p-3 rounded-lg bg-slate-50 focus:border-indigo-500 focus:outline-none">
                        <option value="formula_related">数学体系: 公式相关 (formula_related)</option>
                        <option value="latex_language">排版体系: 语言排版 (latex_language)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">语义子分类 (Sub-category)</label>
                    <input type="text" id="edit-sub-cat" class="w-full border-2 border-slate-200 p-3 rounded-lg focus:border-indigo-500 focus:outline-none" placeholder="例如：物理专用、量子力学算符">
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-bold text-slate-700 mb-2">核心宏命令 (Macro Command)</label>
                <input type="text" id="edit-command" class="w-full border-2 border-slate-200 p-3 rounded-lg font-mono text-indigo-700 bg-indigo-50 focus:border-indigo-500 focus:outline-none" placeholder="\langle | \rangle">
            </div>

            <div class="mb-5">
                <label class="block text-sm font-bold text-slate-700 mb-2">物理语义描述 (Semantic Description)</label>
                <input type="text" id="edit-description" class="w-full border-2 border-slate-200 p-3 rounded-lg focus:border-indigo-500 focus:outline-none" placeholder="狄拉克符号 (表示内积或算符期望值)">
            </div>

            <div class="mb-5">
                <label class="block text-sm font-bold text-slate-700 mb-2">源文件示例 (LaTeX Source Code)</label>
                <textarea id="edit-example" rows="4" class="w-full border-2 border-slate-200 p-3 rounded-lg font-mono text-sm leading-relaxed focus:border-indigo-500 focus:outline-none" oninput="updateLivePreview()" placeholder="在此输入完整的方程或矩阵排版结构..."></textarea>
            </div>

            <div class="mb-8 p-5 bg-slate-50 rounded-lg border-2 border-slate-200 shadow-inner">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">MathJax 渲染管线实时反馈</label>
                <div id="live-preview" class="latex-render min-h-[4rem] flex items-center justify-center bg-white p-4 rounded-md border border-slate-100 overflow-x-auto custom-scrollbar"></div>
            </div>

            <div class="flex justify-end space-x-4 border-t pt-5">
                <button onclick="closeEditModal()" class="px-6 py-2.5 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-bold transition">放弃修改</button>
                <button onclick="saveItem()" id="btn-sync" class="px-6 py-2.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-bold shadow-lg flex items-center transition">
                    <svg id="save-spinner" class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    序列化并同步至 GitHub API
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // GitHub API 核心常量定义区 (开发者必须替换 REPO_OWNER)
        // ==========================================
        const REPO_OWNER = 'YOUR_GITHUB_USERNAME'; // 必须替换为您的 GitHub 用户名
        const REPO_NAME = 'note_for_latex';
        const FILE_PATH = 'data.json';
        
        // 应用状态存储器 (State Container)
        let appData = { formula_related:, latex_language: };
        let isAdmin = false;

        // ==========================================
        // 应用生命周期挂载点 (Lifecycle: Mounted)
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            checkAdminState();
            setupEasterEgg();
            await fetchInitialData();
        });

        // ==========================================
        // 模块 1: 网络通信与 DOM 渲染 (Network & VDOM)
        // ==========================================
        async function fetchInitialData() {
            try {
                // 利用时间戳绕过浏览器与 CDN 激进缓存，确保每次初始化拉取最新物理符号数据
                const response = await fetch(`${FILE_PATH}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('网络拓扑异常或 data.json 缺失');
                appData = await response.json();
                renderUI();
            } catch (error) {
                showToast('致命错误：无法挂载初始化数据，请检查 data.json 物理文件连通性。', 'error');
                console.error('System Boot Error:', error);
            }
        }

        function renderUI() {
            const formulaGrid = document.getElementById('formula-grid');
            const latexGrid = document.getElementById('latex-grid');
            
            // 执行虚拟 DOM 的脏检查与清理
            formulaGrid.innerHTML = '';
            latexGrid.innerHTML = '';

            // 遍历状态树生成卡片视图
            appData.formula_related.forEach(item => {
                formulaGrid.appendChild(createCard(item, 'formula_related'));
            });

            appData.latex_language.forEach(item => {
                latexGrid.appendChild(createCard(item, 'latex_language'));
            });

            // 触发 MathJax AST 语法树解析，将 DOM 中的 LaTeX 纯文本渲染为矢量图形
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(err => console.error('MathJax 渲染管线崩溃:', err));
            }
        }

        function createCard(item, mainCat) {
            const div = document.createElement('div');
            // 采用 Tailwind 构建具有层次感的物理实体卡片
            div.className = "bg-white rounded-xl shadow-sm hover:shadow-xl p-6 border-t-4 border-indigo-500 flex flex-col relative transition-all duration-300 transform hover:-translate-y-1";
            
            // 安全包装渲染内容：判断是独立行环境(包含 begin 或强制换行) 还是内联公式
            let displayEq = item.example.includes('\\begin') |

| item.example.includes('\\\\') 
               ? `$$${item.example}$$` 
                : `$ ${item.example} $`;

            // 动态注入管理员操纵杆
            let adminButtons = isAdmin? `
                <div class="absolute top-3 right-3 flex space-x-2">
                    <button onclick='editItem("${item.id}", "${mainCat}")' class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded transition">编辑节点</button>
                    <button onclick='deleteItem("${item.id}", "${mainCat}")' class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold px-3 py-1.5 rounded transition">销毁</button>
                </div>
            ` : '';

            div.innerHTML = `
                ${adminButtons}
                <span class="inline-block px-2 py-1 bg-slate-100 text-slate-500 text-[10px] font-bold uppercase tracking-widest rounded mb-3 w-max">${escapeHTML(item.category)}</span>
                <h3 class="text-lg font-bold text-slate-800 mb-2 leading-tight">${escapeHTML(item.description)}</h3>
                <div class="mb-5">
                    <code class="text-sm bg-indigo-50 text-indigo-700 px-2 py-1 rounded font-mono break-all font-semibold">${escapeHTML(item.command)}</code>
                </div>
                <div class="mt-auto bg-slate-50 rounded-lg p-4 flex justify-center items-center min-h-[5rem] latex-render overflow-x-auto custom-scrollbar border border-slate-100 shadow-inner">
                    ${displayEq}
                </div>
            `;
            return div;
        }

        // ==========================================
        // 模块 2: UI 隐藏触控逻辑 (Easter Egg Admin Pattern)
        // ==========================================
        function setupEasterEgg() {
            let clickCount = 0;
            let timer;
            document.getElementById('app-title').addEventListener('click', () => {
                clickCount++;
                clearTimeout(timer);
                // 配置 1.5 秒的时间阈值窗口
                timer = setTimeout(() => { clickCount = 0; }, 1500);
                
                // 阈值判定：连续点击五次唤醒管理员终端
                if (clickCount === 5) {
                    if(!isAdmin) {
                        document.getElementById('token-modal').classList.remove('hidden');
                    }
                    clickCount = 0; // 重置触发器
                }
            });
        }

        function saveToken() {
            const token = document.getElementById('github-token-input').value.trim();
            // 严格验证：GitHub Fine-grained token 默认前缀为 github_pat_
            if (token && token.startsWith('github_pat_')) {
                // 使用短效生命周期的 sessionStorage，拒绝持久化污染 localStorage
                sessionStorage.setItem('gh_token', token);
                checkAdminState();
                closeTokenModal();
                showToast('鉴权凭证已注入，超级管理权限开启。', 'success');
            } else {
                showToast('协议驳回：检测到非标准格式凭证，需提供 github_pat_ 开头的令牌。', 'error');
            }
        }

        function checkAdminState() {
            const token = sessionStorage.getItem('gh_token');
            if (token) {
                isAdmin = true;
                document.getElementById('admin-controls').classList.remove('hidden');
            } else {
                isAdmin = false;
                document.getElementById('admin-controls').classList.add('hidden');
            }
            // 触发 VDOM 重绘，挂载或卸载操作按钮
            if(appData.formula_related.length > 0) renderUI(); 
        }

        function logoutAdmin() {
            sessionStorage.removeItem('gh_token');
            checkAdminState();
            showToast('凭证已安全从内存中销毁，权限被降级。', 'success');
        }

        function closeTokenModal() {
            document.getElementById('token-modal').classList.add('hidden');
            document.getElementById('github-token-input').value = '';
        }

        // ==========================================
        // 模块 3: 双向绑定编辑器 (Editor & Live Preview)
        // ==========================================
        function openEditModal(item = null, mainCat = 'formula_related') {
            document.getElementById('edit-modal').classList.remove('hidden');
            if (item) {
                // 编辑存量节点
                document.getElementById('edit-modal-title').innerText = '修订物理数据节点';
                document.getElementById('edit-id').value = item.id;
                document.getElementById('edit-main-cat').value = mainCat;
                document.getElementById('edit-sub-cat').value = item.category;
                document.getElementById('edit-command').value = item.command;
                document.getElementById('edit-description').value = item.description;
                document.getElementById('edit-example').value = item.example;
            } else {
                // 生成新数据节点映射
                document.getElementById('edit-modal-title').innerText = '录入全新物理算符';
                document.getElementById('edit-id').value = 'id-' + Date.now(); // 注入伪随机时间戳 ID
                document.getElementById('edit-command').value = '';
                document.getElementById('edit-description').value = '';
                document.getElementById('edit-example').value = '';
            }
            updateLivePreview(); // 初始化时立即执行一次渲染测试
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        // 高频触发：监听 textarea 实现实时方程渲染
        function updateLivePreview() {
            const example = document.getElementById('edit-example').value;
            const previewDiv = document.getElementById('live-preview');
            let displayEq = example.includes('\\begin') |

| example.includes('\\\\')? `$$${example}$$` : `$ ${example} $`;
            previewDiv.innerHTML = displayEq;
            
            if (window.MathJax && window.MathJax.typesetPromise) {
                // 仅针对预览区 DOM 进行局部重绘，节省系统性能开销
                window.MathJax.typesetPromise().catch(err => console.error(err));
            }
        }

        function editItem(id, mainCat) {
            const item = appData[mainCat].find(x => x.id === id);
            if (item) openEditModal(item, mainCat);
        }

        function deleteItem(id, mainCat) {
            if (confirm('危险操作：确定要从数据库中永久移除此物理节点吗？')) {
                // 过滤隔离被剔除的节点
                appData[mainCat] = appData[mainCat].filter(x => x.id!== id);
                renderUI(); // 本地乐观更新
                syncToGitHub('Drop item: ' + id); // 触发远端强同步
            }
        }

        async function saveItem() {
            const id = document.getElementById('edit-id').value;
            const mainCat = document.getElementById('edit-main-cat').value;
            const newItem = {
                id: id,
                category: document.getElementById('edit-sub-cat').value,
                command: document.getElementById('edit-command').value,
                description: document.getElementById('edit-description').value,
                example: document.getElementById('edit-example').value
            };

            // 路由状态追踪：判断是变更（Update）还是新增（Insert）
            let exists = false;
            ['formula_related', 'latex_language'].forEach(cat => {
                const idx = appData[cat].findIndex(x => x.id === id);
                if (idx > -1) {
                    appData[cat].splice(idx, 1); // 从旧的分支树拔除
                    exists = true;
                }
            });

            // 植入新分支树
            appData[mainCat].push(newItem);
            renderUI(); // 本地乐观更新 UI
            
            // 锁定按钮并显示加载器，防止重复提交造成版本风暴
            const btn = document.getElementById('btn-sync');
            const spinner = document.getElementById('save-spinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');
            
            await syncToGitHub(exists? `Update node ${id}` : `Insert new node ${id}`);
            
            // 释放锁与复位
            spinner.classList.add('hidden');
            btn.disabled = false;
            closeEditModal();
        }

        // ==========================================
        // 模块 4: 数据编解码引擎与 GitHub REST 强一致性同步
        // ==========================================
        
        /**
         * 跨越拉丁字符集鸿沟的加密器：
         * 核心目标：解决原生 btoa() 无法处理中文字符 UTF-16 超出单字节范围导致崩溃的致命缺陷。
         * 机制：使用 TextEncoder 降维成绝对安全的 Uint8Array UTF-8 字节序列，进而重组为安全的 ASCII 虚拟结构，最终送入 btoa 管道。
         */
        function utf8ToBase64(str) {
            const bytes = new TextEncoder().encode(str);
            const binString = Array.from(bytes, (byte) => String.fromCodePoint(byte)).join("");
            return btoa(binString);
        }

        async function syncToGitHub(commitMsg) {
            const token = sessionStorage.getItem('gh_token');
            if (!token) {
                showToast('授权被驳回：内存中未发现鉴权凭证。', 'error');
                return;
            }

            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
            
            try {
                // 阶段一：GET 请求抓取远端文件状态的 SHA 哈希锁，实现乐观并发控制（Optimistic Concurrency Control）
                const getRes = await fetch(url, {
                    headers: { 
                        'Authorization': `Bearer ${token}`, 
                        'Accept': 'application/vnd.github.v3+json' // 遵循 REST API V3 标准格式
                    }
                });

                if (getRes.status === 401) throw new Error('401');
                if (!getRes.ok && getRes.status!== 404) throw new Error('GET_FAILED');
                
                let sha = null;
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha; // 提取加密哈希版本号
                }

                // 阶段二：序列化整个 JSON 状态树并通过 UTF-8 跨字符集编码转换为 Base64 负载
                const jsonString = JSON.stringify(appData, null, 2);
                const base64Content = utf8ToBase64(jsonString);

                const putBody = {
                    message: ` ${commitMsg}`,
                    content: base64Content
                };
                // 如果文件存在，强制附带旧 SHA 哈希解锁版本冲突
                if (sha) putBody.sha = sha;

                // 阶段三：执行 PUT 覆盖写操作
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(putBody)
                });

                if (putRes.status === 401) throw new Error('401');
                if (putRes.status === 409) throw new Error('409');
                if (!putRes.ok) throw new Error('PUT_FAILED');

                // 操作闭环，释放状态提示
                showToast('数据序列化与同步完毕。GitHub Pages 编译重组流水线通常耗时 1-2 分钟生效。', 'success');

            } catch (error) {
                // 严密的状态码拦截反馈与异常降级策略
                if (error.message === '401') {
                    showToast('身份验证失败 (401)：Token 缺失或由于平台安全策略已吊销失效，请重新介入配置。', 'error');
                    logoutAdmin();
                } else if (error.message === '409') {
                    showToast('乐观并发锁拦截 (409)：检测到严重的版本合并冲突。远端文件 SHA 已变异，操作被系统级中止以防止数据覆盖。请刷新 DOM 拉取最新版本。', 'error');
                } else {
                    showToast(`同步管道断裂: 发生未定义错误 ${error.message}`, 'error');
                }
            }
        }

        // ==========================================
        // 模块 5: UI 组件与安全辅助工具链
        // ==========================================
        
        /**
         * 跨站脚本攻击 (XSS) 防御机制：
         * 核心目标：阻断 JSON 负载中可能夹带的恶意 JavaScript 执行指令。
         * 替换非法 HTML 符号，保护 DOM 结构不受侵犯。
         */
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] |

| tag)
            );
        }

        /**
         * 浮动动态吐司通知生成器
         * 利用 Tailwind 动画类和 setTimeout 实现平滑淡入淡出组件生命周期
         */
        function showToast(message, type) {
            const area = document.getElementById('notification-area');
            const bgConfig = type === 'error'? 'bg-rose-500 border-rose-600' : 'bg-emerald-500 border-emerald-600';
            
            const toast = document.createElement('div');
            toast.className = `${bgConfig} border text-white px-5 py-3 rounded-lg shadow-xl flex items-center transform transition-all duration-300 translate-x-full opacity-0 max-w-sm`;
            
            // 加入安全转义符与图标增强提示
            const icon = type === 'error'? '⚠️' : '✅';
            toast.innerHTML = `<span class="mr-3 text-lg">${icon}</span><span class="text-sm font-medium leading-tight">${escapeHTML(message)}</span>`;
            
            area.appendChild(toast);
            
            // 触发生命周期动画：通过宏任务栈微延迟以执行 CSS 过渡
            setTimeout(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            }, 10);
            
            // 设定期望寿命为 5000ms 后触发渐隐与内存释放
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300); // 等待过渡动画播完清理 DOM 引用
            }, 5000);
        }
    </script>
</body>
</html>
