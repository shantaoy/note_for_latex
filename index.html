<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX 符号对照与编辑工具</title>
  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js (符号类别统计) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- KaTeX (公式渲染) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/contrib/auto-render.min.js"></script>
  <style>
    /* 全局平滑滚动与基础背景/字体配置 */
    html { scroll-behavior: smooth; }
    body { 
      background-color: #f8fafc; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }
    
    /* Toast 提示样式优化 */
    .toast {
      visibility: hidden; min-width: 250px; 
      background-color: rgba(30, 41, 59, 0.95); /* 更深的 Slate-800 */
      backdrop-filter: blur(8px);
      color: #fff; font-weight: 500; font-size: 0.875rem;
      text-align: center; border-radius: 9999px; padding: 12px 24px;
      position: fixed; left: 50%; 
      transform: translate(-50%, 20px);
      bottom: 40px; opacity: 0; 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
      z-index: 9999;
    }
    .toast.show { 
      visibility: visible; opacity: 1; transform: translate(-50%, 0); 
    }
    
    /* 管理按钮默认隐藏 */
    .admin-btn { display: none !important; } 
    
    /* 卡片基础悬浮样式 (移植自 latex.html) */
    .symbol-card {
      transition: all 0.2s ease-in-out;
      position: relative;
    }
    .symbol-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    
    /* 瀑布流进入动画 */
    .card-enter {
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0; transform: translateY(20px);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 弹窗动画 */
    .modal-enter { animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .backdrop-enter { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">

  <!-- 顶部导航栏 -->
  <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <!-- 标题与返回链接 -->
        <div class="flex items-center gap-8">
          <div class="flex items-center gap-2 cursor-pointer group" onclick="adminClick()" title="连续点击5次进入管理模式">
            <span class="text-2xl text-blue-600 group-hover:scale-110 transition-transform font-serif">∑</span>
            <span class="font-bold text-xl text-slate-900 tracking-tight">LaTeX 符号参考</span>
          </div>
          <!-- 指向同一仓库其他页面的链接 -->
          <a href="other_file.html" class="text-sm font-medium text-slate-500 hover:text-blue-600 transition-colors whitespace-nowrap">前往其他页面</a>
        </div>
        <!-- 搜索框 (胶囊形) -->
        <div class="flex-1 max-w-md ml-8">
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 transition-colors duration-300">&#128269;</span>
            <input type="text" id="searchInput" placeholder="搜索符号、说明或类别..."
                   class="block w-full rounded-full border-0 py-2 pl-10 pr-4 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6 outline-none transition-all bg-slate-50 focus:bg-white">
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <header class="mb-10 text-center max-w-3xl mx-auto">
      <h1 id="titleHeader" class="text-4xl font-extrabold tracking-tight text-slate-900 sm:text-5xl mb-4">Latex符号对照表</h1>
      <p class="text-lg leading-8 text-slate-600">常用 LaTeX 符号参考。</p>
    </header>

    <!-- 在线尝试 (Playground) 区域 -->
    <section class="mb-12 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        在线尝试 (Playground)
      </h2>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- 输入区 -->
        <div class="flex flex-col h-full">
          <div class="flex justify-between items-center mb-2">
            <label for="playgroundInput" class="block text-sm font-semibold text-slate-700">输入 LaTeX 源码</label>
            <button id="clearPlaygroundBtn" class="text-xs px-2 py-1 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded transition-colors duration-200">清空内容</button>
          </div>
          <textarea id="playgroundInput" placeholder="在此输入组合公式进行测试..."
                    class="w-full h-40 p-4 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 transition-shadow duration-300 outline-none font-mono text-sm resize-y leading-relaxed"></textarea>
        </div>
        <!-- 预览区 -->
        <div class="flex flex-col h-full">
          <label class="block text-sm font-semibold text-slate-700 mb-2 mt-[4px]">实时渲染结果</label>
          <div id="playgroundOutput" class="h-40 p-4 border border-slate-200 rounded-xl bg-slate-50 flex items-center justify-center overflow-auto">
            <span class="text-slate-400 text-sm">等待输入...</span>
          </div>
        </div>
      </div>
    </section>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
      <!-- 类别统计图 -->
      <section class="lg:col-span-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col items-center">
        <h2 class="text-xl font-bold text-slate-900 mb-2 self-start">类别统计</h2>
        <div class="w-full relative flex-1 min-h-[300px] flex items-center justify-center">
            <canvas id="categoryChart"></canvas>
        </div>
      </section>
      
      <!-- 符号列表 -->
      <section class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col">
        <!-- 分类筛选按钮 -->
        <div id="categoryFilters" class="flex flex-wrap gap-2 mb-6"></div>
        <!-- 符号卡片网格 -->
        <div id="symbolsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 max-h-[600px] overflow-y-auto pr-2 pb-4 scroll-smooth"></div>
      </section>
    </div>
  </main>

  <!-- 添加符号按钮 -->
  <button id="addButton" onclick="toggleModal(true)" title="添加自定义符号"
          class="admin-btn fixed bottom-8 right-8 w-14 h-14 bg-blue-600 text-white text-3xl flex items-center justify-center rounded-full shadow-lg hover:bg-blue-700 hover:scale-105 active:scale-95 transition-all duration-300 z-30 focus:outline-none focus:ring-4 focus:ring-blue-300">
    +
  </button>

  <!-- 添加/编辑符号弹窗 -->
  <div id="modalBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
    <div id="modalContent" class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h3 class="text-lg font-bold text-slate-900" id="modalTitle">添加新符号</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 transition-all duration-300 text-2xl outline-none">&times;</button>
      </div>
      <form id="addSymbolForm" class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">分类</label>
          <select id="newSymbolCategory" class="w-full px-4 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <option>希腊字母</option>
            <option>算术运算符</option>
            <option>关系符号</option>
            <option>微积分与微分算子</option>
            <option>物理专用符号</option>
            <option>集合与逻辑符号</option>
            <option>矩阵与括号</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">符号说明</label>
          <input type="text" id="newSymbolLabel" required placeholder="中文描述 (如: 阿尔法)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">LaTeX 源码</label>
          <input type="text" id="newSymbolCode" required placeholder="例如：\alpha" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">渲染预览</label>
          <div id="newSymbolPreview" class="p-4 border border-slate-200 rounded-lg bg-slate-50 min-h-[4rem] flex items-center justify-center text-2xl overflow-x-auto"></div>
        </div>
        <div class="pt-4 flex gap-3">
          <button type="button" onclick="toggleModal(false)" class="flex-1 py-2 px-4 text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors font-medium">取消</button>
          <button type="submit" class="flex-1 py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">保存符号</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 复制成功提示 -->
  <div id="copyToast" class="toast flex items-center gap-2 justify-center">
    <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    <span id="toastMsg">已复制到剪贴板！</span>
  </div>

  <script>
    // 全局状态与常量
    let isAdmin = false;
    let allData = [];
    let currentCategory = '全部';
    const GITHUB_OWNER = 'YOUR_GITHUB_USERNAME';  // 请替换为实际用户名
    const GITHUB_REPO = 'note_for_latex';
    const DATA_PATH = 'data.json';
    let isEditing = false, editingIndex = -1;

    // 预定义的类别颜色，供 Chart.js 使用
    const categoryColors = [
      '#3b82f6', '#8b5cf6', '#f43f5e', '#ec4899', '#10b981', '#f59e0b', '#06b6d4', '#84cc16'
    ];

    // 切换模态框显示 (加入动画控制)
    function toggleModal(show) {
      const modal = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex', 'backdrop-enter');
        content.classList.add('modal-enter');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex', 'backdrop-enter');
        content.classList.remove('modal-enter');
        document.getElementById('addSymbolForm').reset();
        document.getElementById('newSymbolPreview').innerText = '';
        isEditing = false; editingIndex = -1;
        document.getElementById('modalTitle').innerText = '添加新符号';
      }
    }
    
    // 显示提示信息
    function showToast(msg) {
      const toast = document.getElementById('copyToast');
      if(msg) document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 初始化：加载 data.json 并渲染
    async function initApp() {
      try {
        const res = await fetch(DATA_PATH);
        if(res.ok) allData = await res.json(); 
      } catch (e) { console.error('数据加载失败', e); }

      if (sessionStorage.getItem('gh_token')) {
        isAdmin = true;
        document.getElementById('addButton').classList.remove('admin-btn');
      }

      renderCategories();
      renderSymbols();
      setTimeout(renderChart, 50); // 延时以确保 Chart.js 完全加载

      // 引入 localStorage 缓存机制
      const savedLatex = localStorage.getItem('playground_latex');
      if (savedLatex !== null) {
        document.getElementById('playgroundInput').value = savedLatex;
      } else {
        document.getElementById('playgroundInput').value = "f(x) = \\int_{-\\infty}^\\infty \\hat f(\\xi)\\,e^{2 \\pi i \\xi x} \\,d\\xi";
      }
      renderPlayground();
    }

    // 渲染类别筛选按钮 (移植 latex.html 药丸样式)
    function renderCategories() {
      const container = document.getElementById('categoryFilters');
      const cats = ['全部', ...new Set(allData.map(i => i.category))]; // 动态生成存在的分类
      // 补充可能为空的默认分类，保证展示
      const defaultCats = ['希腊字母','数学符号','关系符号','微积分与微分算子','物理专用符号','集合与逻辑符号','矩阵与括号'];
      defaultCats.forEach(c => { if(!cats.includes(c)) cats.push(c); });

      container.innerHTML = cats.map(cat => {
        const isActive = cat === currentCategory;
        const baseClass = "px-4 py-1.5 rounded-full text-sm font-medium transition-colors cursor-pointer border";
        const activeClass = isActive 
            ? "bg-slate-800 text-white border-slate-800 shadow-md" 
            : "bg-white text-slate-600 border-slate-300 hover:bg-slate-50";
        return `<button onclick="setCategory('${cat}')" class="${baseClass} ${activeClass}">${cat}</button>`;
      }).join('');
    }

    // 从 HTML onclick 调用的辅助函数
    function setCategory(cat) {
        currentCategory = cat;
        renderCategories();
        renderSymbols();
    }

    // 渲染符号卡片 (深度融合 latex.html 结构)
    function renderSymbols() {
      const grid = document.getElementById('symbolsGrid');
      grid.innerHTML = '';
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      
      let visualIndex = 0;

      allData.forEach((item, idx) => {
        if ((currentCategory === '全部' || item.category === currentCategory) &&
            (item.label.includes(keyword) || item.latex.includes(keyword) || item.category.includes(keyword))) {
          
          const card = document.createElement('div');
          // 基础样式：白底、细边框、点击整卡复制
          card.className = `symbol-card bg-white rounded-xl border border-slate-200 p-4 cursor-pointer flex flex-col justify-between group card-enter`;
          card.style.animationDelay = `${visualIndex * 0.03}s`;
          visualIndex++;
          
          // 点击复制整卡
          card.onclick = () => {
            navigator.clipboard.writeText(item.latex);
            showToast(`已复制: ${item.latex}`);
          };

          // 防止 XSS 并妥善展示代码
          const safeLatex = item.latex.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

          // 注入结构 (标签 -> 浅灰公式预览盒 -> 标题与粉色代码)
          card.innerHTML = `
            <div class="flex justify-between items-start mb-4 relative">
                <span class="text-xs font-semibold px-2 py-1 rounded bg-slate-100 text-slate-600">${item.category}</span>
            </div>
            <div class="text-center py-4 mb-4 bg-slate-50 rounded-lg overflow-x-auto min-h-[64px] flex items-center justify-center formula-container">
                <span class="text-xl math-preview transition-transform duration-300 group-hover:scale-110"></span>
            </div>
            <div>
                <div class="text-sm font-medium text-slate-900 mb-1">${item.label}</div>
                <code class="text-xs text-pink-600 bg-pink-50 px-2 py-1 rounded block truncate" title="${item.latex}">${safeLatex}</code>
            </div>
          `;

          // 渲染公式
          const formulaSpan = card.querySelector('.math-preview');
          try { katex.render(item.latex, formulaSpan, {throwOnError:false, displayMode: false}); }
          catch { formulaSpan.innerText = item.latex; }

          // 管理模式：编辑与删除按钮 (悬浮显示在右上角外侧一点点)
          if (isAdmin) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'absolute -top-2 -right-2 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10';
            
            // 编辑按钮 (蓝圆)
            const editBtn = document.createElement('button');
            editBtn.innerHTML = '✎';
            editBtn.className = 'w-7 h-7 bg-blue-500 text-white rounded-full flex items-center justify-center text-xs shadow-sm hover:bg-blue-600 transition-colors focus:outline-none';
            editBtn.title = "编辑";
            editBtn.onclick = (e) => {
              e.stopPropagation(); // 阻止卡片级别的复制事件
              isEditing = true; editingIndex = idx;
              document.getElementById('modalTitle').innerText = '编辑符号';
              document.getElementById('newSymbolCategory').value = item.category;
              document.getElementById('newSymbolLabel').value = item.label;
              document.getElementById('newSymbolCode').value = item.latex;
              try {
                  const preview = document.getElementById('newSymbolPreview');
                  katex.render(item.latex, preview, {throwOnError:false});
              } catch(err) {}
              toggleModal(true);
            };
            
            // 删除按钮 (红圆)
            const delBtn = document.createElement('button');
            delBtn.innerHTML = '&times;';
            delBtn.className = 'w-7 h-7 bg-red-500 text-white rounded-full flex items-center justify-center text-lg shadow-sm hover:bg-red-600 transition-colors focus:outline-none pb-0.5';
            delBtn.title = "删除";
            delBtn.onclick = async (e) => {
              e.stopPropagation(); // 阻止复制
              if (confirm('确认删除该符号？')) {
                card.style.transform = 'scale(0.8)';
                card.style.opacity = '0';
                setTimeout(async () => {
                    allData.splice(idx,1);
                    await saveData('删除符号');
                    renderSymbols(); renderChart(); renderCategories();
                }, 200);
              }
            };
            
            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(delBtn);
            // 将按钮容器附在卡片的头部相对定位区
            card.querySelector('.relative').appendChild(actionsDiv);
          }
          grid.appendChild(card);
        }
      });

      if (grid.innerHTML === '') {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">未找到匹配的符号。</div>`;
      }
    }

    // 提交添加/编辑表单
    document.getElementById('addSymbolForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const category = document.getElementById('newSymbolCategory').value;
      const label = document.getElementById('newSymbolLabel').value.trim();
      const latex = document.getElementById('newSymbolCode').value.trim();
      
      if (isEditing && editingIndex >= 0) {
        allData[editingIndex] = {latex, label, category};
      } else {
        // 分组插入逻辑
        let insertIndex = -1;
        for (let i = allData.length - 1; i >= 0; i--) {
          if (allData[i].category === category) { insertIndex = i; break; }
        }
        if (insertIndex !== -1) allData.splice(insertIndex + 1, 0, {latex, label, category});
        else allData.push({latex, label, category});
      }
      
      await saveData(isEditing ? '编辑符号' : '添加符号');
      toggleModal(false);
      renderCategories();
      renderSymbols(); 
      renderChart();
    });

    // 保存到 GitHub (维持原逻辑)
    async function saveData(action) {
      const token = sessionStorage.getItem('gh_token');
      if (!token) { alert('请先进入管理员模式'); return; }
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const fileData = await res.json();
        const sha = fileData.sha;
        const encoder = new TextEncoder();
        const content = JSON.stringify(allData, null, 2);
        const encoded = btoa(String.fromCharCode.apply(null, encoder.encode(content)));
        const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`, {
          method: 'PUT',
          headers: {'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          body: JSON.stringify({message: action, content: encoded, sha: sha})
        });
        const result = await updateRes.json();
        if (updateRes.ok) showToast('提交成功，Pages 编译需 1-2 分钟');
        else showToast(`错误: ${result.message}`);
      } catch (err) {
        showToast('网络请求失败，仅在当前页面缓存中生效');
      }
    }

    // 管理模式入口：点击标题5次
    let clickCount = 0;
    function adminClick() {
      clickCount++;
      if (clickCount>=5) {
        clickCount=0;
        const token = prompt('🔑 进入管理员模式\n请输入 GitHub Token:');
        if (token) {
          sessionStorage.setItem('gh_token', token.trim());
          isAdmin = true;
          document.getElementById('addButton').classList.remove('admin-btn');
          showToast('已开启管理员模式');
          renderSymbols(); // 重新渲染以显示编辑按钮
        }
      }
    }

    // 实时搜索
    document.getElementById('searchInput').addEventListener('input', renderSymbols);
    
    // 实时预览 LaTeX 输入 (模态框内)
    document.getElementById('newSymbolCode').addEventListener('input', (e) => {
      const preview = document.getElementById('newSymbolPreview');
      try { katex.render(e.target.value, preview, {throwOnError:false}); }
      catch { preview.innerText = '格式解析中...'; }
    });

    // 绘制饼图 (移植自 latex.html 风格)
    function renderChart() {
      const ctx = document.getElementById('categoryChart');
      if (!ctx || typeof Chart === 'undefined') return;
      if (ctx.chartInstance) ctx.chartInstance.destroy();
      
      const cats = [...new Set(allData.map(i => i.category))];
      const counts = cats.map(cat => allData.filter(i=>i.category===cat).length);
      const bgColors = cats.map((_, i) => categoryColors[i % categoryColors.length]);
      
      ctx.chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: cats,
          datasets: [{ 
            data: counts,
            backgroundColor: bgColors,
            borderWidth: 0,
            hoverOffset: 6
          }]
        },
        options: { 
          responsive: true,
          maintainAspectRatio: false,
          cutout: '65%', // 移植的较细的环形图效果
          animation: { animateScale: true, animateRotate: true, duration: 600, easing: 'easeOutQuart' },
          plugins: { 
            legend: { 
                position: 'bottom', 
                labels: { padding: 20, font: { size: 12 }, usePointStyle: true } // 点状图例
            },
            tooltip: { backgroundColor: 'rgba(30, 41, 59, 0.9)', padding: 12, cornerRadius: 8 }
          },
          onClick: (event, elements) => {
             // 点击图表直接过滤类别
             if (elements.length > 0) {
                 const index = elements[0].index;
                 const cat = ctx.chartInstance.data.labels[index];
                 setCategory(cat);
             }
          }
        }
      });
    }

    // Playground (在线尝试区域) 逻辑
    function renderPlayground() {
      const inputEl = document.getElementById('playgroundInput');
      const input = inputEl.value.trim();
      const output = document.getElementById('playgroundOutput');
      
      localStorage.setItem('playground_latex', inputEl.value);

      if (!input) {
        output.innerHTML = '<span class="text-slate-400 text-sm">等待输入...</span>';
        return;
      }
      try { 
        katex.render(input, output, { throwOnError: false, displayMode: true }); 
      }
      catch (e) { 
        output.innerHTML = '<span class="text-slate-400 text-sm">格式解析中...</span>'; 
      }
    }
    
    document.getElementById('playgroundInput').addEventListener('input', renderPlayground);
    document.getElementById('clearPlaygroundBtn').addEventListener('click', () => {
      document.getElementById('playgroundInput').value = '';
      renderPlayground();
      document.getElementById('playgroundInput').focus();
    });

    window.onload = initApp;
  </script>
</body>
</html>
