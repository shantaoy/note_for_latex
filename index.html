<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX 符号对照与编辑工具</title>
  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Chart.js (符号类别统计) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- KaTeX (公式渲染) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/contrib/auto-render.min.js"></script>
  <style>
    body { background-color: #f8fafc; }
    /* Toast 提示样式 */
    .toast {
      visibility: hidden; min-width: 200px; background-color: #333; color: #fff;
      text-align: center; border-radius: 8px; padding: 8px;
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 30px; opacity: 0; transition: opacity 0.5s;
    }
    .toast.show { visibility: visible; opacity: 1; }
    .admin-btn { display: none; } /* 管理按钮默认隐藏 */
    .symbol-card code { background-color: #f1f5f9; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-2">
          <span class="text-2xl">∑</span>
          <span class="font-bold text-xl text-slate-900">LaTeX 符号参考</span>
        </div>
        <!-- 搜索框：匹配说明、源码、类别 -->
        <div class="flex-1 max-w-md ml-8">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">&#128269;</span>
            <input type="text" id="searchInput" placeholder="搜索符号、说明或类别"
                   class="block w-full pl-10 pr-4 py-2 border border-slate-300 rounded-md focus:ring focus:border-blue-300 sm:text-sm">
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <header class="mb-10 text-center max-w-3xl mx-auto">
      <h1 class="text-3xl font-extrabold text-slate-900 mb-4">符号对照表</h1>
      <p class="text-lg text-slate-600">常用 LaTeX 符号参考（仅“公式相关”）。可搜索并在管理员模式下编辑。</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
      <!-- 类别统计图 -->
      <section class="lg:col-span-1 bg-white rounded-2xl shadow border border-slate-200 p-6">
        <h2 class="text-xl font-bold text-slate-900 mb-2">类别统计</h2>
        <canvas id="categoryChart"></canvas>
      </section>
      <!-- 符号列表 -->
      <section class="lg:col-span-2 bg-white rounded-2xl shadow border border-slate-200 p-6">
        <!-- 分类筛选按钮 -->
        <div id="categoryFilters" class="flex flex-wrap gap-2 mb-6"></div>
        <!-- 符号卡片网格 -->
        <div id="symbolsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 max-h-[600px] overflow-y-auto pr-2 pb-4"></div>
      </section>
    </div>
  </main>

  <!-- 添加符号按钮（管理员模式显示） -->
  <button id="addButton" onclick="toggleModal(true)" title="添加符号"
          class="admin-btn fixed bottom-8 right-8 w-14 h-14 bg-blue-600 text-white text-xl flex items-center justify-center rounded-full shadow-lg hover:bg-blue-700">+</button>

  <!-- 添加/编辑符号弹窗 -->
  <div id="modalBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black bg-opacity-30">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
        <h3 class="text-lg font-bold text-slate-900" id="modalTitle">添加新符号</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
      </div>
      <form id="addSymbolForm" class="px-6 py-4 space-y-4">
        <!-- 子类别下拉 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">分类</label>
          <select id="newSymbolCategory"
                  class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <option>希腊字母</option>
            <option>算术运算符</option>
            <option>关系符号</option>
            <option>微积分与微分算子</option>
            <option>物理专用符号</option>
            <option>集合与逻辑符号</option>
            <option>矩阵与括号</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">符号说明</label>
          <input type="text" id="newSymbolLabel" required placeholder="中文描述"
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">LaTeX 源码</label>
          <input type="text" id="newSymbolCode" required placeholder="例如：\\alpha"
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">预览</label>
          <div id="newSymbolPreview" class="p-2 border border-slate-200 rounded-lg bg-gray-50 min-h-[2rem]"></div>
        </div>
        <div class="flex justify-end space-x-4 pt-4">
          <button type="button" onclick="toggleModal(false)"
                  class="py-2 px-4 text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50">取消</button>
          <button type="submit" class="py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 复制成功提示 -->
  <div id="copyToast" class="toast">复制成功</div>

  <script>
    // 全局状态与常量
    let isAdmin = false;
    let allData = [];
    let currentCategory = '全部';
    const GITHUB_OWNER = 'YOUR_GITHUB_USERNAME';  // 请替换为实际用户名
    const GITHUB_REPO = 'note_for_latex';
    const DATA_PATH = 'data.json';
    let isEditing = false, editingIndex = -1;

    // 切换模态框显示
    function toggleModal(show) {
      const modal = document.getElementById('modalBackdrop');
      if (show) modal.classList.remove('hidden');
      else {
        modal.classList.add('hidden');
        document.getElementById('addSymbolForm').reset();
        document.getElementById('newSymbolPreview').innerText = '';
        isEditing = false; editingIndex = -1;
      }
    }
    // 显示提示信息
    function showToast(msg) {
      const toast = document.getElementById('copyToast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 初始化：加载 data.json 并渲染
    async function initApp() {
      try {
        const res = await fetch(DATA_PATH);
        allData = await res.json();  // data.json 应为符号对象数组
        if (sessionStorage.getItem('gh_token')) {
          isAdmin = true;
          document.getElementById('addButton').classList.remove('admin-btn');
        }
        renderCategories();
        renderSymbols();
        renderChart();
      } catch (e) { console.error('数据加载失败', e); }
    }

    // 渲染类别筛选按钮
    function renderCategories() {
      const container = document.getElementById('categoryFilters');
      const cats = ['全部','希腊字母','算术运算符','关系符号','微积分与微分算子','物理专用符号','集合与逻辑符号','矩阵与括号'];
      container.innerHTML = '';
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat;
        btn.className = 'px-3 py-1 border rounded-full ' +
          (cat === currentCategory ? 'bg-blue-600 text-white' : 'border-blue-600 text-blue-600');
        btn.onclick = () => { currentCategory = cat; renderSymbols(); renderCategories(); };
        container.appendChild(btn);
      });
    }

    // 渲染符号卡片
    function renderSymbols() {
      const grid = document.getElementById('symbolsGrid');
      grid.innerHTML = '';
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      allData.forEach((item, idx) => {
        // 筛选分类和搜索关键词
        if ((currentCategory === '全部' || item.category === currentCategory) &&
            (item.label.includes(keyword) || item.latex.includes(keyword) || item.category.includes(keyword))) {
          const card = document.createElement('div');
          card.className = 'symbol-card bg-white p-4 rounded-lg shadow relative';

          // 公式渲染
          const formulaDiv = document.createElement('div');
          formulaDiv.className = 'text-2xl mb-2';
          formulaDiv.innerText = item.latex;
          try { katex.render(item.latex, formulaDiv, {throwOnError:false}); }
          catch { formulaDiv.innerText = item.latex; }
          card.appendChild(formulaDiv);

          // 中文说明
          const descP = document.createElement('p');
          descP.className = 'text-sm text-slate-600 mb-2';
          descP.innerText = item.label;
          card.appendChild(descP);

          // 代码示例行与复制按钮
          const codeDiv = document.createElement('div');
          codeDiv.className = 'flex justify-between items-center text-sm';
          const codeEl = document.createElement('code');
          codeEl.className = 'font-mono';
          codeEl.innerText = item.latex;
          codeDiv.appendChild(codeEl);
          const copyBtn = document.createElement('button');
          copyBtn.innerText = '📋';
          copyBtn.title = '复制 LaTeX 源码';
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(item.latex);
            showToast('复制成功');
          };
          codeDiv.appendChild(copyBtn);
          card.appendChild(codeDiv);

          // 管理模式：编辑/删除按钮
          if (isAdmin) {
            const editBtn = document.createElement('button');
            editBtn.textContent = '编辑';
            editBtn.className = 'absolute top-2 right-12 text-blue-600 hover:underline';
            editBtn.onclick = () => {
              isEditing = true; editingIndex = idx;
              document.getElementById('newSymbolCategory').value = item.category;
              document.getElementById('newSymbolLabel').value = item.label;
              document.getElementById('newSymbolCode').value = item.latex;
              document.getElementById('newSymbolPreview').innerText = item.latex;
              toggleModal(true);
            };
            card.appendChild(editBtn);
            const delBtn = document.createElement('button');
            delBtn.textContent = '删除';
            delBtn.className = 'absolute top-2 right-2 text-red-600 hover:underline';
            delBtn.onclick = async () => {
              if (confirm('确认删除该符号？')) {
                allData.splice(idx,1);
                await saveData('删除符号');
                renderSymbols(); renderChart();
              }
            };
            card.appendChild(delBtn);
          }
          grid.appendChild(card);
        }
      });
    }

    // 提交添加/编辑表单
    document.getElementById('addSymbolForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const category = document.getElementById('newSymbolCategory').value;
      const label = document.getElementById('newSymbolLabel').value.trim();
      const latex = document.getElementById('newSymbolCode').value.trim();
      if (isEditing && editingIndex>=0) {
        allData[editingIndex] = {latex, label, category};
      } else {
        allData.push({latex, label, category});
      }
      await saveData(isEditing?'编辑符号':'添加符号');
      toggleModal(false);
      renderSymbols(); renderChart();
    });

    // 保存到 GitHub (流程同前，获取 sha 并 PUT)
    async function saveData(action) {
      const token = sessionStorage.getItem('gh_token');
      if (!token) { alert('请先进入管理员模式'); return; }
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const fileData = await res.json();
        const sha = fileData.sha;
        const encoder = new TextEncoder();
        const content = JSON.stringify(allData, null, 2);
        const encoded = btoa(String.fromCharCode.apply(null, encoder.encode(content)));
        const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`, {
          method: 'PUT',
          headers: {'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          body: JSON.stringify({message: action, content: encoded, sha: sha})
        });
        const result = await updateRes.json();
        if (updateRes.ok) showToast('提交成功，Pages 编译需 1-2 分钟');
        else showToast(`错误: ${result.message}`);
      } catch (err) {
        showToast('请求失败');
      }
    }

    // 管理模式入口：点击标题5次
    let clickCount = 0;
    document.querySelector('h1').addEventListener('click', () => {
      clickCount++;
      if (clickCount>=5) {
        clickCount=0;
        const token = prompt('请输入 GitHub Token');
        if (token) {
          sessionStorage.setItem('gh_token', token.trim());
          isAdmin = true;
          document.getElementById('addButton').classList.remove('admin-btn');
        }
      }
    });

    // 实时搜索
    document.getElementById('searchInput').addEventListener('input', renderSymbols);
    // 实时预览 LaTeX 输入
    document.getElementById('newSymbolCode').addEventListener('input', (e) => {
      const preview = document.getElementById('newSymbolPreview');
      try { katex.render(e.target.value, preview, {throwOnError:false}); }
      catch { preview.innerText = ''; }
    });

    // 绘制饼图：统计各子类别数量
    function renderChart() {
      const ctx = document.getElementById('categoryChart');
      if (ctx.chart) ctx.chart.destroy();
      const cats = ['希腊字母','算术运算符','关系符号','微积分与微分算子','物理专用符号','集合与逻辑符号','矩阵与括号'];
      const counts = cats.map(cat => allData.filter(i=>i.category===cat).length);
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: cats,
          datasets: [{ data: counts,
            backgroundColor: ['#3b82f6','#6366f1','#ef4444','#10b981','#8b5cf6','#f59e0b','#ec4899'] }]
        },
        options: { plugins:{ legend:{position:'bottom'} } }
      });
    }

    window.onload = initApp;
  </script>
</body>
</html>
