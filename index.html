<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX 符号对照与编辑工具</title>
  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js (符号类别统计) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- KaTeX (公式渲染) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/contrib/auto-render.min.js"></script>
  <style>
    /* 全局平滑滚动与基础背景 */
    html { scroll-behavior: smooth; }
    body { background-color: #f8fafc; }
    
    /* Toast 提示样式优化 (增加毛玻璃和滑动动效) */
    .toast {
      visibility: hidden; min-width: 200px; 
      background-color: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(8px);
      color: #fff; font-weight: 500;
      text-align: center; border-radius: 9999px; padding: 10px 20px;
      position: fixed; left: 50%; 
      transform: translate(-50%, 20px);
      bottom: 40px; opacity: 0; 
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
      z-index: 9999;
    }
    .toast.show { 
      visibility: visible; opacity: 1; transform: translate(-50%, 0); 
    }
    
    /* 管理按钮默认隐藏 (增加 !important 防止被 Tailwind 的 flex 覆盖) */
    .admin-btn { display: none !important; } 
    
    /* 符号代码块样式 */
    .symbol-card code { 
      background-color: #f1f5f9; padding: 2px 6px; 
      border-radius: 6px; transition: background-color 0.3s ease;
    }
    
    /* 自定义动画：卡片依次向上浮现 */
    .card-enter {
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 自定义动画：弹窗弹性弹出 */
    .modal-enter {
      animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    
    /* 弹窗背景淡入 */
    .backdrop-enter {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">

  <!-- 顶部导航栏 (增加毛玻璃效果和过渡) -->
  <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="adminClick()">
          <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
            <span class="text-2xl font-serif">∑</span>
          </div>
          <span class="font-bold text-xl text-slate-900 tracking-tight">LaTeX 符号参考</span>
        </div>
        <!-- 搜索框 -->
        <div class="flex-1 max-w-md ml-8">
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 transition-colors duration-300 group-focus-within:text-blue-500">&#128269;</span>
            <input type="text" id="searchInput" placeholder="搜索符号、说明或类别..."
                   class="block w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all duration-300 sm:text-sm outline-none">
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <header class="mb-10 text-center max-w-3xl mx-auto">
      <h1 id="titleHeader" class="text-4xl font-extrabold text-slate-900 mb-4 tracking-tight">Latex符号对照表</h1>
      <p class="text-lg text-slate-500">常用 LaTeX 符号参考。</p>
    </header>

    <!-- 在线尝试 (Playground) 区域 -->
    <section class="mb-12 bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 border border-slate-200 p-6">
      <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        在线尝试 (Playground)
      </h2>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- 输入区 -->
        <div class="flex flex-col h-full">
          <div class="flex justify-between items-center mb-2">
            <label for="playgroundInput" class="block text-sm font-semibold text-slate-600">输入 LaTeX 源码</label>
            <button id="clearPlaygroundBtn" class="text-xs px-2 py-1 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded transition-colors duration-200">清空内容</button>
          </div>
          <!-- 修复无法拉动问题: 将 transition-all 替换为 transition-shadow -->
          <textarea id="playgroundInput" placeholder="在此输入组合公式进行测试，例如：\int_{a}^{b} x^2 \,dx..."
                    class="w-full h-40 p-4 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-shadow duration-300 outline-none font-mono text-sm resize-y leading-relaxed"></textarea>
        </div>
        <!-- 预览区 -->
        <div class="flex flex-col h-full">
          <label class="block text-sm font-semibold text-slate-600 mb-2 mt-[4px]">实时渲染结果</label>
          <div id="playgroundOutput" class="h-40 p-4 border border-slate-200 rounded-xl bg-slate-50 flex items-center justify-center overflow-auto transition-shadow duration-300">
            <!-- 渲染结果将在这里显示 -->
            <span class="text-slate-400 text-sm">等待输入...</span>
          </div>
        </div>
      </div>
    </section>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
      <!-- 类别统计图 (增加 hover 阴影) -->
      <section class="lg:col-span-1 bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 border border-slate-200 p-6 flex flex-col items-center">
        <h2 class="text-xl font-bold text-slate-800 mb-4 self-start">类别统计</h2>
        <div class="w-full relative flex-1 min-h-[250px] flex items-center justify-center">
            <canvas id="categoryChart"></canvas>
        </div>
      </section>
      
      <!-- 符号列表 -->
      <section class="lg:col-span-2 bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 border border-slate-200 p-6 flex flex-col">
        <!-- 分类筛选按钮 -->
        <div id="categoryFilters" class="flex flex-wrap gap-2.5 mb-6"></div>
        <!-- 符号卡片网格 -->
        <div id="symbolsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 max-h-[600px] overflow-y-auto pr-2 pb-4 scroll-smooth"></div>
      </section>
    </div>
  </main>

  <!-- 添加符号按钮（增加悬停放大和点击缩放动效） -->
  <button id="addButton" onclick="toggleModal(true)" title="添加符号"
          class="admin-btn fixed bottom-8 right-8 w-14 h-14 bg-blue-600 text-white text-2xl flex items-center justify-center rounded-full shadow-[0_4px_20px_rgba(37,99,235,0.4)] hover:bg-blue-700 hover:scale-110 active:scale-95 transition-all duration-300 z-30">
    +
  </button>

  <!-- 添加/编辑符号弹窗 -->
  <div id="modalBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
    <div id="modalContent" class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <h3 class="text-lg font-bold text-slate-900" id="modalTitle">添加新符号</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-700 hover:rotate-90 transition-all duration-300 text-2xl outline-none">&times;</button>
      </div>
      <form id="addSymbolForm" class="px-6 py-5 space-y-4">
        <!-- 子类别下拉 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">分类</label>
          <select id="newSymbolCategory"
                  class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all duration-300 outline-none">
            <option>希腊字母</option>
            <option>算术运算符</option>
            <option>关系符号</option>
            <option>微积分与微分算子</option>
            <option>物理专用符号</option>
            <option>集合与逻辑符号</option>
            <option>矩阵与括号</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">符号说明</label>
          <input type="text" id="newSymbolLabel" required placeholder="中文描述 (如: 阿尔法)"
                 class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all duration-300 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">LaTeX 源码</label>
          <input type="text" id="newSymbolCode" required placeholder="例如：\alpha"
                 class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all duration-300 outline-none font-mono text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">渲染预览</label>
          <div id="newSymbolPreview" class="p-4 border border-slate-200 rounded-xl bg-slate-50 min-h-[4rem] flex items-center justify-center text-3xl transition-all duration-300"></div>
        </div>
        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" onclick="toggleModal(false)"
                  class="py-2.5 px-5 text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hover:text-slate-900 active:scale-95 transition-all duration-300 font-medium">取消</button>
          <button type="submit" 
                  class="py-2.5 px-6 bg-blue-600 text-white rounded-xl hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-500/30 active:scale-95 transition-all duration-300 font-medium">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 复制成功提示 -->
  <div id="copyToast" class="toast flex items-center gap-2 justify-center">
    <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    <span id="toastMsg">复制成功</span>
  </div>

  <script>
    // 全局状态与常量
    let isAdmin = false;
    let allData = [];
    let currentCategory = '全部';
    const GITHUB_OWNER = 'shantaoy';  // 请替换为实际用户名
    const GITHUB_REPO = 'note_for_latex';
    const DATA_PATH = 'data.json';
    let isEditing = false, editingIndex = -1;

    // 切换模态框显示 (加入动画控制)
    function toggleModal(show) {
      const modal = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex', 'backdrop-enter');
        content.classList.add('modal-enter');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex', 'backdrop-enter');
        content.classList.remove('modal-enter');
        document.getElementById('addSymbolForm').reset();
        document.getElementById('newSymbolPreview').innerText = '';
        isEditing = false; editingIndex = -1;
        document.getElementById('modalTitle').innerText = '添加新符号';
      }
    }
    
    // 显示提示信息
    function showToast(msg) {
      const toast = document.getElementById('copyToast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // 初始化：加载 data.json 并渲染
    async function initApp() {
      try {
        const res = await fetch(DATA_PATH);
        allData = await res.json(); 
        
        if (sessionStorage.getItem('gh_token')) {
          isAdmin = true;
          document.getElementById('addButton').classList.remove('admin-btn');
        }
        renderCategories();
        renderSymbols();
        renderChart();
      } catch (e) { 
        console.error('数据加载失败', e); 
      }

      // 引入 localStorage 缓存机制
      const savedLatex = localStorage.getItem('playground_latex');
      if (savedLatex !== null) {
        document.getElementById('playgroundInput').value = savedLatex;
      } else {
        document.getElementById('playgroundInput').value = "f(x) = \\int_{-\\infty}^\\infty \\hat f(\\xi)\\,e^{2 \\pi i \\xi x} \\,d\\xi";
      }
      renderPlayground();
    }

    // 渲染类别筛选按钮 (加入微交互动效)
    function renderCategories() {
      const container = document.getElementById('categoryFilters');
      const cats = ['全部','希腊字母','算术运算符','关系符号','微积分与微分算子','物理专用符号','集合与逻辑符号','矩阵与括号'];
      container.innerHTML = '';
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat;
        // 添加 Tailwind 动效类
        const baseClasses = 'px-4 py-1.5 border rounded-full text-sm font-medium transition-all duration-300 active:scale-95 focus:outline-none ';
        btn.className = baseClasses + (cat === currentCategory 
            ? 'bg-blue-600 border-blue-600 text-white shadow-md shadow-blue-500/30' 
            : 'bg-white border-slate-200 text-slate-600 hover:border-blue-300 hover:text-blue-600 hover:bg-blue-50');
        
        btn.onclick = () => { 
            currentCategory = cat; 
            renderSymbols(); 
            renderCategories(); 
        };
        container.appendChild(btn);
      });
    }

    // 渲染符号卡片
    function renderSymbols() {
      const grid = document.getElementById('symbolsGrid');
      grid.innerHTML = '';
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      
      let visualIndex = 0; // 用于计算瀑布流动画延迟

      allData.forEach((item, idx) => {
        if ((currentCategory === '全部' || item.category === currentCategory) &&
            (item.label.includes(keyword) || item.latex.includes(keyword) || item.category.includes(keyword))) {
          
          const card = document.createElement('div');
          // 增加悬浮悬浮上移、发光、渐变框等动效
          card.className = `symbol-card group bg-white p-5 rounded-xl border border-slate-100 shadow-sm relative transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl hover:shadow-slate-200/50 hover:border-blue-200 card-enter`;
          // 设置动画延迟实现瀑布流展示
          card.style.animationDelay = `${visualIndex * 0.04}s`;
          visualIndex++;

          // 公式渲染 (增加大小过渡)
          const formulaDiv = document.createElement('div');
          formulaDiv.className = 'text-3xl mb-4 flex justify-center items-center h-16 transition-transform duration-300 group-hover:scale-110';
          try { katex.render(item.latex, formulaDiv, {throwOnError:false}); }
          catch { formulaDiv.innerText = item.latex; }
          card.appendChild(formulaDiv);

          // 中文说明
          const descP = document.createElement('p');
          descP.className = 'text-sm font-medium text-slate-700 mb-3';
          descP.innerText = item.label;
          card.appendChild(descP);

          // 代码示例行与复制按钮
          const codeDiv = document.createElement('div');
          codeDiv.className = 'flex justify-between items-center text-xs mt-auto';
          
          const codeEl = document.createElement('code');
          codeEl.className = 'font-mono text-slate-500 overflow-hidden text-ellipsis whitespace-nowrap group-hover:bg-blue-50 group-hover:text-blue-700';
          codeEl.innerText = item.latex;
          codeDiv.appendChild(codeEl);
          
          const copyBtn = document.createElement('button');
          // 复制按钮默认淡化，悬浮卡片时显现，点击有缩放
          copyBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>`;
          copyBtn.title = '复制 LaTeX 源码';
          copyBtn.className = 'p-1.5 rounded-md text-slate-400 opacity-50 hover:opacity-100 group-hover:opacity-100 hover:text-blue-600 hover:bg-blue-50 active:scale-90 transition-all duration-300 cursor-pointer';
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(item.latex);
            showToast('已复制源码');
          };
          codeDiv.appendChild(copyBtn);
          card.appendChild(codeDiv);

          // 管理模式：编辑/删除按钮
          if (isAdmin) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'absolute top-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300';
            
            const editBtn = document.createElement('button');
            editBtn.innerHTML = '✎';
            editBtn.className = 'text-blue-500 hover:text-blue-700 w-6 h-6 rounded bg-blue-50 flex items-center justify-center hover:scale-110 active:scale-95 transition-all';
            editBtn.title = "编辑";
            editBtn.onclick = () => {
              isEditing = true; editingIndex = idx;
              document.getElementById('modalTitle').innerText = '编辑符号';
              document.getElementById('newSymbolCategory').value = item.category;
              document.getElementById('newSymbolLabel').value = item.label;
              document.getElementById('newSymbolCode').value = item.latex;
              try {
                  const preview = document.getElementById('newSymbolPreview');
                  katex.render(item.latex, preview, {throwOnError:false});
              } catch(e) {}
              toggleModal(true);
            };
            
            const delBtn = document.createElement('button');
            delBtn.innerHTML = '×';
            delBtn.className = 'text-red-500 hover:text-red-700 w-6 h-6 rounded bg-red-50 flex items-center justify-center hover:scale-110 active:scale-95 transition-all text-lg font-bold pb-0.5';
            delBtn.title = "删除";
            delBtn.onclick = async () => {
              if (confirm('确认删除该符号？')) {
                // 删除时添加一个缩小的动画再执行实际删除
                card.style.transform = 'scale(0.8)';
                card.style.opacity = '0';
                setTimeout(async () => {
                    allData.splice(idx,1);
                    await saveData('删除符号');
                    renderSymbols(); renderChart();
                }, 300);
              }
            };
            
            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(delBtn);
            card.appendChild(actionsDiv);
          }
          grid.appendChild(card);
        }
      });
    }

    // 提交添加/编辑表单
    document.getElementById('addSymbolForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const category = document.getElementById('newSymbolCategory').value;
      const label = document.getElementById('newSymbolLabel').value.trim();
      const latex = document.getElementById('newSymbolCode').value.trim();
      
      if (isEditing && editingIndex >= 0) {
        allData[editingIndex] = {latex, label, category};
      } else {
        // 查找属于同一个 category 的最后一个元素的索引
        let insertIndex = -1;
        for (let i = allData.length - 1; i >= 0; i--) {
          if (allData[i].category === category) {
            insertIndex = i;
            break;
          }
        }
        
        if (insertIndex !== -1) {
          // 如果找到了同类元素，则插入到该元素之后
          allData.splice(insertIndex + 1, 0, {latex, label, category});
        } else {
          // 如果没有找到（新类别），则直接追加到末尾
          allData.push({latex, label, category});
        }
      }
      
      await saveData(isEditing ? '编辑符号' : '添加符号');
      toggleModal(false);
      renderSymbols(); 
      renderChart();
    });

    // 保存到 GitHub
    async function saveData(action) {
      const token = sessionStorage.getItem('gh_token');
      if (!token) { alert('请先进入管理员模式'); return; }
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const fileData = await res.json();
        const sha = fileData.sha;
        const encoder = new TextEncoder();
        const content = JSON.stringify(allData, null, 2);
        const encoded = btoa(String.fromCharCode.apply(null, encoder.encode(content)));
        const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`, {
          method: 'PUT',
          headers: {'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          body: JSON.stringify({message: action, content: encoded, sha: sha})
        });
        const result = await updateRes.json();
        if (updateRes.ok) showToast('提交成功，Pages 编译需 1-2 分钟');
        else showToast(`错误: ${result.message}`);
      } catch (err) {
        showToast('请求失败，仅在本地生效');
      }
    }

    // 管理模式入口：点击标题5次
    let clickCount = 0;
    function adminClick() {
      clickCount++;
      if (clickCount>=5) {
        clickCount=0;
        const token = prompt('🔑 进入管理员模式\n请输入 GitHub Token:');
        if (token) {
          sessionStorage.setItem('gh_token', token.trim());
          isAdmin = true;
          document.getElementById('addButton').classList.remove('admin-btn');
          showToast('已开启管理员模式');
          renderSymbols(); // 重新渲染以显示编辑按钮
        }
      }
    }

    // 实时搜索
    document.getElementById('searchInput').addEventListener('input', renderSymbols);
    
    // 实时预览 LaTeX 输入 (模态框内)
    document.getElementById('newSymbolCode').addEventListener('input', (e) => {
      const preview = document.getElementById('newSymbolPreview');
      try { katex.render(e.target.value, preview, {throwOnError:false}); }
      catch { preview.innerText = '格式解析中...'; preview.className = "p-4 border border-slate-200 rounded-xl bg-slate-50 min-h-[4rem] flex items-center justify-center text-sm text-slate-400"; }
    });

    // 绘制饼图：统计各子类别数量 (加入动画配置)
    function renderChart() {
      const ctx = document.getElementById('categoryChart');
      if (ctx.chart) ctx.chart.destroy();
      const cats = ['希腊字母','算术运算符','关系符号','微积分与微分算子','物理专用符号','集合与逻辑符号','矩阵与括号'];
      const counts = cats.map(cat => allData.filter(i=>i.category===cat).length);
      
      ctx.chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: cats,
          datasets: [{ 
            data: counts,
            backgroundColor: ['#3b82f6','#6366f1','#ef4444','#10b981','#8b5cf6','#f59e0b','#ec4899'],
            borderWidth: 0,
            hoverOffset: 8 // 图表 hover 时的外扩动效
          }]
        },
        options: { 
          responsive: true,
          maintainAspectRatio: false,
          animation: { animateScale: true, animateRotate: true, duration: 800, easing: 'easeOutQuart' },
          plugins:{ 
            legend:{ position:'bottom', labels: { padding: 15, font: { family: 'inherit' } } },
            tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                padding: 12,
                cornerRadius: 8,
            }
          },
          layout: { padding: 10 }
        }
      });
    }

    // Playground (在线尝试区域) 逻辑
    function renderPlayground() {
      const inputEl = document.getElementById('playgroundInput');
      const input = inputEl.value.trim();
      const output = document.getElementById('playgroundOutput');
      
      // 每次渲染时同步保存到本地存储
      localStorage.setItem('playground_latex', inputEl.value);

      if (!input) {
        output.innerHTML = '<span class="text-slate-400 text-sm">等待输入...</span>';
        return;
      }
      try { 
        katex.render(input, output, {
          throwOnError: false,
          displayMode: true // 大公式模式
        }); 
      }
      catch (e) { 
        output.innerHTML = '<span class="text-slate-400 text-sm">格式解析中...</span>'; 
      }
    }
    
    // 绑定实时输入监听
    document.getElementById('playgroundInput').addEventListener('input', renderPlayground);

    // 绑定清空按钮
    document.getElementById('clearPlaygroundBtn').addEventListener('click', () => {
      document.getElementById('playgroundInput').value = '';
      renderPlayground();
      document.getElementById('playgroundInput').focus();
    });

    window.onload = initApp;
  </script>
</body>
</html>
